# Every number here is a decision, not a constant. Edit this file, not the code.
#
# This covers YOUR positions — spot and margin, across accounts — and is independent of any bot.
# The market maker's book is the market maker's business.

target_ratio: 0.50          # share of exposure to insure

# Cover must outlast the position it protects. This is what rules out rolling short-dated puts:
# they are cheaper per contract and far more expensive per day of cover, and they leave the gap
# you most need closed — the one between expiries.
min_tenor_days: 180

# Refuse if the cheapest insurance costs more than this share of the protected notional.
# 1200 bps = 12%. Moving this is a real risk decision; make it deliberately.
max_premium_bps: 1200

# Recorded on every plan so a consumer never has to re-derive why the number is what it is.
triggers:
  - "insurance is bought against a thesis, not a price: re-evaluate when the position it protects is closed"

venues:
  # Primary candidate. Gate stays closed until ops/derive_book_probe.mjs shows a non-empty book.
  - kind: put_venue
    venue: derive
    live: false
    note: "V3 mainnet pre-launch: production orderbook verified empty on 2026-09-26"
    premium_bps: 0.0        # MUST come from a real quote. Never guessed.
    tenor_days: 270         # Derive lists 181 / 272 / 363d quarterlies

  # Expected later. Not listed yet — no instrument, no quote, nothing to cost.
  - kind: put_venue
    venue: lighter_options
    live: false
    note: "Lighter options do not exist yet; placeholder for the expected venue"
    premium_bps: 0.0
    tenor_days: 270
